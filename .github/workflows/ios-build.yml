name: ios-build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ["standard"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/build-ios
          key: ios-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ios-${{ matrix.variant }}-

      - name: Install dependencies
        run: |
          brew install ccache ninja aqtinstall

      - name: Configure CMake
        run: |
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_QT=OFF \
            -DENABLE_LIBRETRO=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_ROOM_STANDALONE=OFF

      - name: Build
        run: cmake --build build-ios --config Release -j$(sysctl -n hw.ncpu)

      - name: Run tests
        if: matrix.variant == 'standard'
        run: ctest --test-dir build-ios -VV -C Release

      - name: Package IPA
        run: |
          set -euo pipefail

          # Locate the .app bundle produced by the build
          APP_DIR=$(find build-ios -maxdepth 5 -name "Azahar.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::Azahar.app not found in build tree"
            exit 1
          fi
          echo "Found app bundle: $APP_DIR"

          # Build the Payload/ tree required by the IPA format
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_DIR" "$STAGING/Payload/"

          # Copy the entitlements into the .app so sideloaders can reference them
          cp src/ios/AzaharApp/Resources/Azahar.entitlements \
             "$STAGING/Payload/Azahar.app/Azahar.entitlements"

          # Create the IPA (zip of the Payload tree)
          mkdir -p artifacts
          (cd "$STAGING" && zip -r -q "$GITHUB_WORKSPACE/artifacts/Azahar.ipa" Payload/)
          echo "IPA created:"
          ls -lh artifacts/Azahar.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.variant }}
          path: artifacts/Azahar.ipa
          if-no-files-found: error
          retention-days: 30
